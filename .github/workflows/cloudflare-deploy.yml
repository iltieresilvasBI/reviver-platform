name: Deploy Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: reviver-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://blyvwsbbrnhpswvxezjt.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_4rlp2NXYO9blpvsrRS-C7A_VX6ssJAi
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: TypeScript
        run: npm run typecheck
      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials detected."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets."
          fi

      - name: Build for Cloudflare Workers
        if: steps.cloudflare.outputs.configured == 'true'
        run: npm run cf:build

      - name: Deploy directly to Cloudflare Workers
        if: steps.cloudflare.outputs.configured == 'true'
        run: npx opennextjs-cloudflare deploy

      - name: Verify deployed Worker
        if: steps.cloudflare.outputs.configured == 'true'
        shell: bash
        env:
          BASE_URL: https://reviver-platform.iltieresilvas.workers.dev
        run: |
          set -euo pipefail

          ready=false
          for attempt in {1..18}; do
            headers=$(mktemp)
            code=$(curl -sS -o /tmp/reviver-home -D "$headers" -w "%{http_code}" "$BASE_URL/")
            echo "Production readiness attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]               && grep -qi '^x-content-type-options: nosniff' "$headers"               && grep -qi '^x-frame-options: SAMEORIGIN' "$headers"               && grep -qi '^referrer-policy: strict-origin-when-cross-origin' "$headers"               && grep -qi '^permissions-policy: camera=(), microphone=(), geolocation=()' "$headers"               && grep -qi '^strict-transport-security: max-age=31536000; includeSubDomains' "$headers"; then
              ready=true
              break
            fi
            sleep 5
          done

          test "$ready" = "true"

          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$BASE_URL/api/health")
          echo "/api/health -> $code"
          test "$code" = "200"

          code=$(curl -sS -o /tmp/repertoire.json -w "%{http_code}" "$BASE_URL/api/public/worship-repertoire")
          echo "/api/public/worship-repertoire -> $code"
          test "$code" = "200"
          grep -q '"ok":true' /tmp/repertoire.json

          protected_headers=$(mktemp)
          code=$(curl -sS -o /dev/null -D "$protected_headers" -w "%{http_code}" "$BASE_URL/admin/site")
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub("\r",""); print $2}' "$protected_headers" | tail -1)
          echo "/admin/site -> $code $location"
          case "$code" in
            301|302|303|307|308) ;;
            *) exit 1 ;;
          esac
          echo "$location" | grep -q "/login"
