name: Worship UI Validation

on:
  pull_request:
    paths:
      - 'app/worship/**'
      - 'scripts/test-worship-flow.mjs'
      - 'components/app-shell.tsx'
      - 'app/globals.css'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/worship-ui-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://blyvwsbbrnhpswvxezjt.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_4rlp2NXYO9blpvsrRS-C7A_VX6ssJAi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check dependency security
        run: npm audit --audit-level=high
      - name: Worship role journey and button contract tests
        run: node scripts/test-worship-flow.mjs
      - name: TypeScript validation
        run: npm run typecheck
      - name: Next.js build
        run: npm run build
      - name: Cloudflare compatibility build
        run: npm run cf:build
