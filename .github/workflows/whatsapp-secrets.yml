name: Configure WhatsApp Worker Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WHATSAPP_GRAPH_VERSION: ${{ secrets.WHATSAPP_GRAPH_VERSION }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
      WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
      WHATSAPP_TEMPLATE_LANGUAGE: ${{ secrets.WHATSAPP_TEMPLATE_LANGUAGE }}
      WHATSAPP_TEMPLATE_SCHEDULE_PUBLISHED: ${{ secrets.WHATSAPP_TEMPLATE_SCHEDULE_PUBLISHED }}
      WHATSAPP_TEMPLATE_SUBSTITUTION_REQUEST: ${{ secrets.WHATSAPP_TEMPLATE_SUBSTITUTION_REQUEST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in             CLOUDFLARE_API_TOKEN             CLOUDFLARE_ACCOUNT_ID             SUPABASE_SERVICE_ROLE_KEY             WHATSAPP_GRAPH_VERSION             WHATSAPP_PHONE_NUMBER_ID             WHATSAPP_ACCESS_TOKEN             WHATSAPP_WEBHOOK_VERIFY_TOKEN             WHATSAPP_APP_SECRET             WHATSAPP_TEMPLATE_SCHEDULE_PUBLISHED             WHATSAPP_TEMPLATE_SUBSTITUTION_REQUEST
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          test "$missing" = "0"

      - name: Sync WhatsApp secrets to Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail

          put_secret() {
            local name="$1"
            local value="$2"
            printf '%s' "$value" | npx wrangler secret put "$name"
          }

          put_secret SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          put_secret WHATSAPP_GRAPH_VERSION "$WHATSAPP_GRAPH_VERSION"
          put_secret WHATSAPP_PHONE_NUMBER_ID "$WHATSAPP_PHONE_NUMBER_ID"
          put_secret WHATSAPP_ACCESS_TOKEN "$WHATSAPP_ACCESS_TOKEN"
          put_secret WHATSAPP_WEBHOOK_VERIFY_TOKEN "$WHATSAPP_WEBHOOK_VERIFY_TOKEN"
          put_secret WHATSAPP_APP_SECRET "$WHATSAPP_APP_SECRET"
          put_secret WHATSAPP_TEMPLATE_LANGUAGE "${WHATSAPP_TEMPLATE_LANGUAGE:-pt_PT}"
          put_secret WHATSAPP_TEMPLATE_SCHEDULE_PUBLISHED "$WHATSAPP_TEMPLATE_SCHEDULE_PUBLISHED"
          put_secret WHATSAPP_TEMPLATE_SUBSTITUTION_REQUEST "$WHATSAPP_TEMPLATE_SUBSTITUTION_REQUEST"

      - name: Verify Worker reports WhatsApp ready
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          body=$(curl -fsS https://reviver-platform.iltieresilvas.workers.dev/api/health)
          echo "$body" | grep -q '"whatsapp":"ready"'
          echo "WhatsApp integration reported ready by /api/health"
